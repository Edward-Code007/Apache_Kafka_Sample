# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET_CI

on:
  workflow_dispatch:
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: SetUp_Docker
      uses: docker/setup-docker-action@v5.1.0
    - name: Login_Docker
      uses: docker/login-action@v4.1.0
      with:
        username: ${{secrets.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_PSSD}}
    - name: BuildNPush_WebApi
      uses: docker/build-push-action@v7.1.0
      with:
        file: ./Dockerfile.Webapi
        push: true
        tags: edwardcoder423/webapi:v2
    - name: BuildNPush_Consumer
      uses: docker/build-push-action@v7.1.0
      with:
        file: ./Dockerfile.Consumer
        push: true
        tags: edwardcoder423/consumer:v2
      
